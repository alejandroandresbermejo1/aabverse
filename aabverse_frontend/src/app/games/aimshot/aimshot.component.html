<div class="game-wrapper">
  <div class="bg-grid"></div>

  <div class="app-layout" [class]="'app-layout crosshair-mode-' + crosshairStyle()">
    <app-aimshot-navbar
      [classicHighScore]="classicHighScore()"
      [survivalHighScore]="survivalHighScore()"
      [huntHighScore]="huntHighScore()"
      [isLoadingRecords]="isLoadingRecords()"
      (goHome)="gameComp.resetToIdle()"
    />

    <main class="app-main">
      <div class="mobile-unsupported-banner">
        <div class="unsupported-icon-box">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="desktop-monitor-svg"
          >
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <h2 class="unsupported-title">Resolución no compatible</h2>
        <p class="unsupported-desc">
          <strong>AimShot</strong> es un simulador de puntería de alta precisión diseñado
          exclusivamente para jugar con <strong>ratón</strong> en
          <strong>pantallas más grandes</strong>.
        </p>
      </div>

      <div class="desktop-game-container">
        <app-ongame
          #gameComp
          [crosshairStyle]="crosshairStyle()"
          (crosshairStyleChange)="crosshairStyle.set($event)"
          (newScoreEvent)="onScoreSubmitted($event)"
        />
      </div>
    </main>

    <app-aimshot-footer />
  </div>
</div>
