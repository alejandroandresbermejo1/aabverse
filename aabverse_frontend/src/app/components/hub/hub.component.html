<div class="hub-container">
  <div class="bg-grid"></div>

  <app-hub-navbar [(searchQuery)]="searchQuery"></app-hub-navbar>

  <div class="hub-body-wrapper">
    <main class="games-grid">
      @for (game of filteredGames; track game.id) {
        <article
          class="game-card"
          [class.desktop-only-game]="game.desktopOnly"
          [style.--glow-color]="game.bgGlow"
          [style.--theme-color]="game.themeColor || '#a855f7'"
        >
          <div class="card-header">
            <div
              class="card-header-icon"
              [style.background]="game.gradient"
              [style.box-shadow]="'0 0 20px ' + game.bgGlow"
            >
              @if (game.logoImg) {
                <img [src]="game.logoImg" [alt]="game.title + ' Logo'" class="card-logo-img" />
              } @else {
                <span class="icon-emoji">{{ game.icon }}</span>
              }
            </div>
            <h2 class="card-title">{{ game.title }}</h2>
          </div>

          <div class="card-body">
            <p class="card-desc">{{ game.description }}</p>
          </div>

          <div class="card-footer">
            <a
              [routerLink]="game.route"
              class="play-btn desktop-play-btn"
              [style.background]="game.gradient"
            >
              <span>JUGAR AHORA</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </a>
            @if (game.desktopOnly) {
              <div class="disabled-play-btn">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="disabled-icon"
                >
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span>Solo disponible en Ordenador</span>
              </div>
            }
          </div>
        </article>
      }

      <article
        class="game-card coming-soon-card"
        style="--glow-color: rgba(16, 185, 129, 0.3); --theme-color: #10b981"
      >
        <div class="coming-soon-centered-content">
          <div class="coming-icon-wrapper">
            <svg
              class="rocket-svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.71.12-2.47-.5-3.1-.63-.63-2.39-1.21-3.1-.5z"
              />
              <path
                d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-3.05 11a22.35 22.35 0 0 1-3.95 2z"
              />
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
            </svg>
          </div>
          <span class="coming-soon-title">Próximamente</span>
        </div>
      </article>
    </main>
  </div>

  <app-hub-footer></app-hub-footer>
</div>
